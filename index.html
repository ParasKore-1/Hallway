<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hallway — AI operations for letting agents</title>
    <meta
      name="description"
      content="Hallway answers tenant enquiries, books viewings, triages maintenance and chases rent — so UK letting agents can stop firefighting and start growing."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f2eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1012" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <!--
      Runs before first paint:
      1. Apply a stored theme choice (no light/dark flash). Without one, CSS follows the OS.
      2. First visit this session + motion allowed → show the preloader cover immediately
         (html.is-preloading). Repeat visits and reduced-motion users never see it.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem('hallway-theme');
          if (t === 'light' || t === 'dark') d.dataset.theme = t;
        } catch (e) {}
        try {
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var home = location.pathname === '/' || location.pathname === '/index.html';
          if (!reduce && home && !sessionStorage.getItem('hallway-visited')) {
            // Timeline mirrors src/lib/intro.ts (INTRO_READY_MS / INTRO_DONE_MS).
            d.classList.add('is-preloading');
            setTimeout(function () {
              d.classList.add('is-preloader-leaving');
              window.dispatchEvent(new Event('hallway:intro-ready'));
            }, 850);
            setTimeout(function () {
              d.classList.remove('is-preloading', 'is-preloader-leaving');
              try {
                sessionStorage.setItem('hallway-visited', '1');
              } catch (e) {}
            }, 1150);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1rem; font-family: system-ui, sans-serif">
        Hallway’s pages work without JavaScript; animations and the demo form need it.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
